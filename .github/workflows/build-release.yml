name: Build Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*"
      - "v*.*.*"

permissions:
  contents: write

env:
  THEOS: ''
  PKG_VERSION: ''
  XCODE_VERSION: '16.4'

jobs:
  build:
    name: Build and upload release package for TrollStore
    runs-on: macos-15

    steps:
      - name: Setup Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Ensure iOS platform runtime
        run: |
          xcodebuild -version
          xcrun simctl list runtimes || true

      - name: Install Homebrew dependencies
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK=1 brew install dpkg make libplist openssl@3 ldid-procursus
          echo "/usr/local/opt/make/libexec/gnubin" >> $GITHUB_PATH

      - name: Checkout roothide/theos
        uses: actions/checkout@v4
        with:
          repository: roothide/theos
          path: theos
          submodules: recursive

      - name: Add THEOS environment variables
        run: |
          rm -rf $GITHUB_WORKSPACE/theos/sdks
          echo "THEOS=$GITHUB_WORKSPACE/theos" >> $GITHUB_ENV

      - name: Checkout theos/sdks
        uses: actions/checkout@v4
        with:
          repository: theos/sdks
          ref: master
          path: ${{ env.THEOS }}/sdks

      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: BinanceMonitor
          submodules: recursive

      - name: Setup build environment
        run: |
          echo "Available SDKs: $(find $THEOS/sdks -name "*.sdk" -maxdepth 1 -print)"
          echo "FINALPACKAGE=1" >> $GITHUB_ENV
          cd $GITHUB_WORKSPACE/BinanceMonitor
          echo "PKG_VERSION=$(./get-version.sh)" >> $GITHUB_ENV

      - name: Build tipa packages
        run: |
          cd $GITHUB_WORKSPACE/BinanceMonitor
          ./gen-control.sh
          ./build.sh
          FINALPACKAGE=1 gmake clean package

      - name: Upload tipa artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BinanceMonitor_${{ env.PKG_VERSION }}_tipa
          path: |
            BinanceMonitor/packages/*.tipa

      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.PKG_VERSION }}
          body_path: BinanceMonitor/CHANGELOG.md
          files: |
            BinanceMonitor/packages/*.tipa
